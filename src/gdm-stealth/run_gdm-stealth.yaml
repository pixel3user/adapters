# NOTE: gdm-stealth tasks require the parity custom agent (not yet
# implemented) to host episode tools/raters and write the outcome
# file. The oracle agent below cannot pass these tasks (solve.sh
# exits 1 by design); see README Notes & Caveats.
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  force_build: true
  delete: true
  # env:
  #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #   ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
agents:
  - name: oracle
  # - name: claude-code
  #   model_name: anthropic/claude-haiku-4-5
datasets:
  - path: datasets/gdm-stealth